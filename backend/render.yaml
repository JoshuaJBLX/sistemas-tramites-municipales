# Configuración de despliegue para Render
# Este archivo define cómo Render debe construir y ejecutar tu aplicación

services:
  - type: web
    name: tramites-municipales-backend
    env: python
    plan: free  # Cambiar a starter/standard si necesitas más recursos
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    # Especificar versión de Python compatible con pydantic
    pythonVersion: 3.11.9

    # Variables de entorno requeridas (se configuran en el dashboard de Render)
    envVars:
      - key: PORT
        value: 8000

    # Health check para verificar que el servicio está funcionando
    healthCheckPath: /health

    # Configuración para spinning up con recursos suficientes
    # Necesario para modelos ML y sentence-transformers
    numInstances: 1
