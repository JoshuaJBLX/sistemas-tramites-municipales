# fly.toml app configuration file generated for tramites-municipales-backend on 2026-10-25T18:02:12-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tramites-municipales-backend'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

# Configuración no sensible. Los secretos (POSTGRES_*, REDIS_URL,
# OPENROUTER_API_KEY, SUPABASE_SERVICE_ROLE_KEY) van con `fly secrets set`.
[env]
  EMBEDDING_MODEL = 'BAAI/bge-m3'
  EMBEDDING_DEVICE = 'cpu'
  RAG_TOP_K = '5'
  CACHE_TTL_SEGUNDOS = '3600'
  DOCUMENTS_PATH = './storage/documentos'
  SUPABASE_STORAGE_BUCKET = 'documentos'
  SUPABASE_URL = 'https://ifjfkdmgtpjwuvcrphbd.supabase.co'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 4096
